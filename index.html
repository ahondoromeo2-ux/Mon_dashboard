<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Dashboard</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #1e1e2f;
            color: #fff;
        }

        .sidebar {
            width: 220px;
            background-color: #111;
            position: fixed;
            height: 100%;
            padding-top: 20px;
        }

        .sidebar h2 {
            text-align: center;
            color: #fff;
        }

        .sidebar ul {
            list-style-type: none;
            padding: 0;
        }

        .sidebar ul li {
            padding: 15px;
            text-align: center;
        }

        .sidebar ul li a {
            color: #fff;
            text-decoration: none;
            display: block;
            border-radius: 5px;
        }

        .sidebar ul li a:hover {
            background-color: #007BFF;
        }

        .main {
            margin-left: 240px;
            padding: 20px;
        }

        /* Barre de navigation */
        .navbar {
            background-color: #111;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .navbar input, .navbar select, .navbar button {
            padding: 8px;
            margin-left: 5px;
            border-radius: 5px;
            border: none;
        }

        .navbar button {
            background-color: #007BFF;
            color: white;
            cursor: pointer;
        }

        .navbar button:hover {
            background-color: #0056b3;
        }

        /* Assistant IA */
        #assistant {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 300px;
            background: #111;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            color: #fff;
            padding: 10px;
        }

        #messages {
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 10px;
        }

        #userInput {
            width: 60%;
            padding: 5px;
        }

        #assistant button {
            padding: 5px 10px;
            margin-left: 5px;
        }
    </style>
</head>
<body>
    <!-- Barre de navigation -->
    <div class="navbar">
        <form id="searchForm" target="_blank">
            <input type="text" id="query" placeholder="Rechercher...">
            <select id="engine">
                <option value="google">Google</option>
                <option value="bing">Bing</option>
                <option value="duckduckgo">DuckDuckGo</option>
                <option value="maps">Google Maps</option>
            </select>
            <button type="submit">🔍</button>
        </form>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>Mon Dashboard</h2>
        <ul>
            <li><a href="/meteo">☁️ Météo</a></li>
            <li><a href="/news">📰 News du Monde</a></li>
            <li><a href="/boussole">🧭 Boussole</a></li>
            <li><a href="/scanner">📷 Scanneur</a></li>
            <li><a href="/frequence">🎵 Fréquence</a></li>
            <li><a href="/infrarouge">🌐 Infrarouge</a></li>
            <li><a href="/galerie">🎞️ Galerie</a></li>
            <li><a href="/jeux">🎮 Mini-jeux</a></li>
            <li><a href="/notes">📝 Notes</a></li>
            <li><a href="/stats">📊 Statistiques</a></li>
            <li><a href="/horloge">⏰ Horloge mondiale</a></li>
        </ul>
    </div>

    <!-- Contenu principal -->
    <div class="main">
        <h1>Bienvenue Roméo 🚀</h1>
        <p>Sélectionne un module dans le menu à gauche.</p>
    </div>

    <!-- Assistant IA -->
    <div id="assistant">
        <div id="chatbox">
            <div id="messages"></div>
            <input type="text" id="userInput" placeholder="Écris ta commande...">
            <button onclick="sendCommand()">Envoyer</button>
            <button onclick="startVoice()">🎤</button>
        </div>
    </div>

    <script>
        // Barre de recherche
        document.getElementById("searchForm").addEventListener("submit", function(e) {
            e.preventDefault();
            let query = document.getElementById("query").value;
            let engine = document.getElementById("engine").value;
            let url = "";

            if(engine === "google") {
                url = "https://www.google.com/search?q=" + encodeURIComponent(query);
            } else if(engine === "bing") {
                url = "https://www.bing.com/search?q=" + encodeURIComponent(query);
            } else if(engine === "duckduckgo") {
                url = "https://duckduckgo.com/?q=" + encodeURIComponent(query);
            } else if(engine === "maps") {
                url = "https://www.google.com/maps/search/" + encodeURIComponent(query);
            }

            window.open(url, "_blank");
        });

        // Assistant IA connecté à OpenAI
        async function sendCommand() {
            let input = document.getElementById("userInput").value;
            let messages = document.getElementById("messages");

            messages.innerHTML += "<p><strong>Vous:</strong> " + input + "</p>";

            let response = await fetch("/assistant", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({message: input})
            });

            let data = await response.json();
            let aiReply = data.reply;

            messages.innerHTML += "<p><strong>Assistant:</strong> " + aiReply + "</p>";
            document.getElementById("userInput").value = "";

            // Exemple d'interprétation automatique
            if(aiReply.toLowerCase().includes("sombre")) {
                document.body.style.backgroundColor = "#1e1e2f";
                document.body.style.color = "#fff";
            }
            if(aiReply.toLowerCase().includes("clair")) {
                document.body.style.backgroundColor = "#f4f4f9";
                document.body.style.color = "#000";
            }
        }

        // 🎤 Reconnaissance vocale
        function startVoice() {
            let recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = "fr-FR";
            recognition.start();

            recognition.onresult = function(event) {
                let voiceCommand = event.results[0][0].transcript;
                document.getElementById("userInput").value = voiceCommand;
                sendCommand();
            };
        }
    </script>
</body>
</html>
