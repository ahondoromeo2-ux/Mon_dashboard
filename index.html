<!-- Module Statistiques personnelles -->
<div id="statsModule">
    <h3>📊 Statistiques personnelles</h3>
    <canvas id="statsChart" width="400" height="200"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    // Charger les stats depuis localStorage ou initialiser
    let statsCounters = JSON.parse(localStorage.getItem("statsCounters")) || {
        "Météo": 0,
        "News": 0,
        "Galerie": 0,
        "Jeux": 0,
        "Notes": 0
    };

    // Initialiser Chart.js avec les données persistantes
    const ctx = document.getElementById("statsChart").getContext("2d");
    window.statsChart = new Chart(ctx, {
        type: "bar",
        data: {
            labels: Object.keys(statsCounters),
            datasets: [{
                label: "Nombre d'ouvertures",
                data: Object.values(statsCounters),
                backgroundColor: ["#007BFF", "#28a745", "#ffc107", "#dc3545", "#17a2b8"]
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { display: false },
                title: { display: true, text: "Utilisation des modules" }
            }
        }
    });

    // Fonction pour incrémenter et sauvegarder
    function incrementStats(moduleName) {
        if(statsCounters[moduleName] !== undefined) {
            statsCounters[moduleName]++;
            localStorage.setItem("statsCounters", JSON.stringify(statsCounters)); // Sauvegarde
            window.statsChart.data.datasets[0].data = Object.values(statsCounters);
            window.statsChart.update();
        }
    }
</script>
