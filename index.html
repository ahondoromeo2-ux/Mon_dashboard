<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Dashboard</title>
    <script src="actions.js"></script> <!-- Import du dictionnaire -->
    <style>
        /* Styles identiques à avant */
    </style>
</head>
<body>
    <!-- Barre de navigation -->
    <div class="navbar">
        <form id="searchForm" target="_blank">
            <input type="text" id="query" placeholder="Rechercher...">
            <select id="engine">
                <option value="google">Google</option>
                <option value="bing">Bing</option>
                <option value="duckduckgo">DuckDuckGo</option>
                <option value="maps">Google Maps</option>
            </select>
            <button type="submit">🔍</button>
        </form>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>Mon Dashboard</h2>
        <ul>
            <li><a href="/meteo">☁️ Météo</a></li>
            <li><a href="/news">📰 News du Monde</a></li>
            <li><a href="/boussole">🧭 Boussole</a></li>
            <li><a href="/scanner">📷 Scanneur</a></li>
            <li><a href="/frequence">🎵 Fréquence</a></li>
            <li><a href="/infrarouge">🌐 Infrarouge</a></li>
            <li><a href="/galerie">🎞️ Galerie</a></li>
            <li><a href="/jeux">🎮 Mini-jeux</a></li>
            <li><a href="/notes">📝 Notes</a></li>
            <li><a href="/stats">📊 Statistiques</a></li>
            <li><a href="/horloge">⏰ Horloge mondiale</a></li>
        </ul>
    </div>

    <!-- Contenu principal -->
    <div class="main">
        <h1>Bienvenue Roméo 🚀</h1>
        <p>Sélectionne un module dans le menu à gauche.</p>
    </div>

    <!-- Assistant IA -->
    <div id="assistant">
        <div id="chatbox">
            <div id="messages"></div>
            <input type="text" id="userInput" placeholder="Écris ta commande...">
            <button onclick="sendCommand()">Envoyer</button>
            <button onclick="startVoice()">🎤</button>
        </div>
    </div>

    <script>
        // Barre de recherche
        document.getElementById("searchForm").addEventListener("submit", function(e) {
            e.preventDefault();
            let query = document.getElementById("query").value;
            let engine = document.getElementById("engine").value;
            let url = "";
            if(engine === "google") url = "https://www.google.com/search?q=" + encodeURIComponent(query);
            else if(engine === "bing") url = "https://www.bing.com/search?q=" + encodeURIComponent(query);
            else if(engine === "duckduckgo") url = "https://duckduckgo.com/?q=" + encodeURIComponent(query);
            else if(engine === "maps") url = "https://www.google.com/maps/search/" + encodeURIComponent(query);
            window.open(url, "_blank");
        });

        // Assistant IA connecté à OpenAI
        async function sendCommand() {
            let input = document.getElementById("userInput").value;
            let messages = document.getElementById("messages");
            messages.innerHTML += "<p><strong>Vous:</strong> " + input + "</p>";

            let response = await fetch("/assistant", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({message: input})
            });

            let data = await response.json();
            let aiReply = data.reply;
            messages.innerHTML += "<p><strong>Assistant:</strong> " + aiReply + "</p>";
            document.getElementById("userInput").value = "";

            try {
                let parsed = JSON.parse(aiReply);

                if(parsed.action && actions[parsed.action]) {
                    actions[parsed.action]();
                }
                if(parsed.actions) {
                    parsed.actions.forEach(act => {
                        if(actions[act]) actions[act]();
                    });
                }
            } catch(e) {
                console.error("Erreur parsing JSON:", e);
            }
        }

        // 🎤 Reconnaissance vocale
        function startVoice() {
            let recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = "fr-FR";
            recognition.start();
            recognition.onresult = function(event) {
                let voiceCommand = event.results[0][0].transcript;
                document.getElementById("userInput").value = voiceCommand;
                sendCommand();
            };
        }
    </script>
</body>
</html>
