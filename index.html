<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Dashboard</title>
    <script src="actions.js"></script> <!-- Import du dictionnaire -->
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background-color: #1e1e2f; color: #fff; }
        .sidebar { width: 220px; background-color: #111; position: fixed; height: 100%; padding-top: 20px; }
        .sidebar h2 { text-align: center; color: #fff; }
        .sidebar ul { list-style-type: none; padding: 0; }
        .sidebar ul li { padding: 15px; text-align: center; }
        .sidebar ul li a { color: #fff; text-decoration: none; display: block; border-radius: 5px; }
        .sidebar ul li a:hover { background-color: #007BFF; }
        .main { margin-left: 240px; padding: 20px; }
        .navbar { background-color: #111; padding: 10px; display: flex; justify-content: center; align-items: center; }
        .navbar input, .navbar select, .navbar button { padding: 8px; margin-left: 5px; border-radius: 5px; border: none; }
        .navbar button { background-color: #007BFF; color: white; cursor: pointer; }
        .navbar button:hover { background-color: #0056b3; }
        #assistant { position: fixed; bottom: 20px; right: 20px; width: 300px; background: #111; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.5); color: #fff; padding: 10px; }
        #messages { max-height: 200px; overflow-y: auto; margin-bottom: 10px; }
        #userInput { width: 60%; padding: 5px; }
        #assistant button { padding: 5px 10px; margin-left: 5px; }
        #worldClock, #weatherWidget { background:#222; padding:15px; border-radius:10px; margin-bottom:20px; }
    </style>
</head>
<body>
    <!-- Barre de navigation -->
    <div class="navbar">
        <form id="searchForm" target="_blank">
            <input type="text" id="query" placeholder="Rechercher...">
            <select id="engine">
                <option value="google">Google</option>
                <option value="bing">Bing</option>
                <option value="duckduckgo">DuckDuckGo</option>
                <option value="maps">Google Maps</option>
            </select>
            <button type="submit">🔍</button>
        </form>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>Mon Dashboard</h2>
        <ul>
            <li><a href="/meteo">☁️ Météo</a></li>
            <li><a href="/news">📰 News du Monde</a></li>
            <li><a href="/boussole">🧭 Boussole</a></li>
            <li><a href="/scanner">📷 Scanneur</a></li>
            <li><a href="/frequence">🎵 Fréquence</a></li>
            <li><a href="/infrarouge">🌐 Infrarouge</a></li>
            <li><a href="/galerie">🎞️ Galerie</a></li>
            <li><a href="/jeux">🎮 Mini-jeux</a></li>
            <li><a href="/notes">📝 Notes</a></li>
            <li><a href="/stats">📊 Statistiques</a></li>
            <li><a href="/horloge">⏰ Horloge mondiale</a></li>
        </ul>
    </div>

    <!-- Contenu principal -->
    <div class="main">
        <h1>Bienvenue Roméo 🚀</h1>
        <p>Sélectionne un module dans le menu à gauche.</p>

        <!-- Horloge mondiale -->
        <div id="worldClock">
            <h3>🕒 Horloge mondiale</h3>
            <p id="paris"></p>
            <p id="lome"></p>
            <p id="tokyo"></p>
            <p id="newyork"></p>
        </div>

        <!-- Widget météo -->
        <div id="weatherWidget">
            <h3>☁️ Météo locale</h3>
            <p id="weather"></p>
        </div>
    </div>

    <!-- Assistant IA -->
