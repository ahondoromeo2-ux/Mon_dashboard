{% extends "base.html" %}

{% block content %}
    <h2>Météo du jour</h2>
    <form method="post">
        <input type="text" name="city" placeholder="Entrez une ville">
        <button type="submit">Voir la météo</button>
    </form>

    {% if meteo %}
        <p>Ville : {{ meteo.ville }}</p>
        <p>Température : {{ meteo.temperature }}</p>
        <p>Condition : {{ meteo.condition }}</p>
    {% endif %}
{% endblock %}
