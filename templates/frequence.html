<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Générateur de Fréquence</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .controls {
            margin: 20px auto;
            text-align: center;
        }
        input {
            padding: 10px;
            margin: 10px;
            width: 120px;
        }
        button {
            padding: 10px 20px;
            margin: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="main">
        <h1>🎵 Générateur de Fréquence</h1>
        <div class="controls">
            <label for="freq">Fréquence (Hz) :</label>
            <input type="number" id="freq" value="440">
            <br>
            <button onclick="playTone()">▶️ Jouer</button>
            <button onclick="stopTone()">⏹️ Stop</button>
        </div>
    </div>

    <script>
        let audioCtx = null;
        let oscillator = null;

        function playTone() {
            let freq = document.getElementById("freq").value;
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            oscillator = audioCtx.createOscillator();
            oscillator.type = "sine"; // forme d’onde : sinus
            oscillator.frequency.setValueAtTime(freq, audioCtx.currentTime);
            oscillator.connect(audioCtx.destination);
            oscillator.start();
        }

        function stopTone() {
            if (oscillator) {
                oscillator.stop();
                oscillator.disconnect();
                oscillator = null;
            }
        }
    </script>
</body>
</html>
