{% extends "base.html" %}

{% block content %}
    <h2>Laboratoire IA 🤖</h2>
    <form method="post">
        <textarea name="texte" placeholder="Entrez un texte" rows="5" cols="50"></textarea><br>
        <select name="action">
            <option value="resume">Résumé</option>
            <option value="traduction">Traduction (en anglais)</option>
            <option value="sentiment">Analyse de sentiment</option>
            <option value="creatif">Transformation créative</option>
        </select><br><br>
        <button type="submit">Tester IA</button>
    </form>

    {% if resultat %}
        <h3>Résultat :</h3>
        <p id="resultat">{{ resultat }}</p>
        <button onclick="copierTexte()">📋 Copier le résultat</button>
    {% endif %}

    <script>
        function copierTexte() {
            const texte = document.getElementById("resultat").innerText;
            navigator.clipboard.writeText(texte).then(() => {
                alert("Résultat copié dans le presse-papier !");
            });
        }
    </script>
{% endblock %}
