{% extends "base.html" %}

{% block content %}
    <h2>Laboratoire IA 🤖</h2>
    <form method="post">
        <textarea name="texte" placeholder="Entrez un texte" rows="5" cols="50"></textarea><br>
        <select name="action">
            <option value="resume">Résumé</option>
            <option value="traduction">Traduction (en anglais)</option>
            <option value="sentiment">Analyse de sentiment</option>
            <option value="creatif">Transformation créative</option>
        </select><br><br>
        <button type="submit">Tester IA</button>
    </form>

    {% if resultat %}
        <h3>Résultat :</h3>
        <p id="resultat">{{ resultat }}</p>
        <button onclick="copierTexte()">📋 Copier le résultat</button>
        <button onclick="telechargerTexte()">💾 Télécharger en .txt</button>

        <!-- Formulaire d'envoi par email -->
        <form method="post" action="/envoyer_email">
            <input type="hidden" name="contenu" value="{{ resultat }}">
            <input type="text" name="objet" placeholder="Entrez l'objet de l'email"><br>
            <input type="text" name="expediteur_nom" placeholder="Nom de l'expéditeur"><br>
            <input type="text" name="destinataire" placeholder="Entrez une ou plusieurs adresses (séparées par des virgules)"><br>
            <button type="submit">📧 Envoyer par email</button>
        </form>
    {% endif %}

    <script>
        function copierTexte() {
            const texte = document.getElementById("resultat").innerText;
            navigator.clipboard.writeText(texte).then(() => {
                alert("Résultat copié dans le presse-papier !");
            });
        }

        function telechargerTexte() {
            const texte = document.getElementById("resultat").innerText;
            const blob = new Blob([texte], { type: "text/plain" });
            const lien = document.createElement("a");
            lien.href = URL.createObjectURL(blob);
            lien.download = "resultat_IA.txt";
            lien.click();
        }
    </script>
{% endblock %}
